<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#03030b">
<title>A little surprise for Fari</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 45%, #10102b 0%, #060612 48%, #03030b 100%);
    color: white; font-family: Georgia, "Times New Roman", serif;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .intro {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    padding: 24px; text-align: center; z-index: 2;
    background: radial-gradient(ellipse at center, rgba(9,8,27,.25), rgba(3,3,11,.35));
    transition: opacity 1s ease, transform 1s ease;
  }
  .intro.hide { opacity: 0; pointer-events: none; transform: scale(1.04); }
  .eyebrow { color: #aaa5ff; letter-spacing: .28em; text-transform: uppercase; font: 11px/1.5 Arial, sans-serif; }
  h1 { margin: 0; font-weight: normal; font-size: clamp(34px, 7vw, 62px); letter-spacing: .06em; text-shadow: 0 0 25px #766bff; }
  .sub { color: #c9c6e7; font: 14px/1.7 Arial, sans-serif; max-width: 290px; }
  button {
    margin-top: 10px; padding: 13px 25px; border-radius: 99px; cursor: pointer;
    color: #fff; border: 1px solid rgba(174,157,255,.8);
    background: linear-gradient(120deg, rgba(72,49,145,.6), rgba(30,115,158,.35));
    box-shadow: 0 0 24px rgba(115,89,255,.25); letter-spacing: .12em;
    font: 12px Arial, sans-serif; transition: transform .2s, box-shadow .2s;
  }
  button:active { transform: scale(.97); }
  .name {
    position: fixed; left: 50%; top: 78%; transform: translate(-50%, 10px);
    z-index: 3; opacity: 0; pointer-events: none; text-align: center;
    font-size: clamp(42px, 10vw, 76px); letter-spacing: .12em;
    color: #fff4ff; text-shadow: 0 0 8px #fff, 0 0 22px #d05cff, 0 0 48px #765bff;
    transition: opacity 1.3s ease, transform 1.3s ease;
  }
  .name.show { opacity: 1; transform: translate(-50%, 0); }
  .hint { position: fixed; bottom: 18px; width: 100%; text-align: center; color: #77748e; font: 10px Arial,sans-serif; letter-spacing: .13em; z-index: 2; }
  @media (max-height: 600px) { .name { top: 80%; } .intro { gap: 10px; } }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="intro" id="intro">
  <div class="eyebrow">a tiny little surprise</div>
  <h1>For you</h1>
  <div class="sub">Some things are better when they appear unexpectedly.</div>
  <button id="open">OPEN YOUR SURPRISE ✦</button>
</div>
<div class="name" id="name">Fari</div>
<div class="hint" id="hint">MADE OF A LITTLE MAGIC ✧</div>
<script>
(() => {
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const intro = document.getElementById('intro');
  const name = document.getElementById('name');
  const hint = document.getElementById('hint');
  let w, h, dpr, particles = [], stars = [], started = false, startTime = 0;
  const TAU = Math.PI * 2;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    stars = Array.from({length: Math.floor(w*h/4200)}, () => ({
      x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.3+.25,
      a: Math.random()*.55+.15, p: Math.random()*TAU
    }));
  }
  function shape(a, scale) {
    const radius = (Math.exp(Math.cos(a)) - 2*Math.cos(4*a) + Math.pow(Math.sin(a/12),5))*scale;
    return { x: radius*Math.sin(a), y: radius*Math.cos(a) };
  }
  function hex(c) {
    return `rgb(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)})`;
  }
  function mix(a,b,t) { return a.map((v,i)=>v+(b[i]-v)*t); }
  function colorFor(scale) {
    if(scale < 41) return mix([.32,.95,1],[.22,.42,1],scale/41);
    if(scale < 74) return mix([.22,.42,1],[.88,.20,1],(scale-41)/33);
    let t=(scale-74)/18; t=t*t*(3-2*t);
    return mix([.88,.20,1],[.24,.025,.42],t);
  }
  function makeParticles() {
    // Deterministic pattern similar to the original Python artwork.
    let seed = 12;
    const rand = () => { seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
    const pts = [];
    for(let i=0;i<5600;i++) pts.push({a:rand()*TAU, s:3+rand()*89});
    pts.sort((a,b)=>a.s-b.s);
    const scale = Math.min(w,h)*.00355;
    const cx=w/2, cy=h*.43;
    particles = pts.map(p => {
      const q=shape(p.a,p.s);
      const angle=Math.atan2(q.y,q.x)+((rand()-.5)*.36);
      const len=3+rand()*5;
      return {
        x:cx+q.x*scale, y:cy-q.y*scale,
        x2:cx+(q.x+len*Math.cos(angle))*scale,
        y2:cy-(q.y+len*Math.sin(angle))*scale,
        c:hex(colorFor(p.s)), width:.7+rand()*.6,
        delay:p.s/92*4700+rand()*550,
        alpha:.55+rand()*.45
      };
    });
  }
  function draw(now) {
    ctx.clearRect(0,0,w,h);
    for(const st of stars) {
      const twinkle=.55+.45*Math.sin(now*.001+st.p);
      ctx.globalAlpha=st.a*twinkle; ctx.fillStyle='#d9dcff';
      ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,TAU); ctx.fill();
    }
    ctx.globalAlpha=1;
    if(started) {
      const elapsed=now-startTime;
      for(const p of particles) {
        if(elapsed < p.delay) continue;
        const fade=Math.min(1,(elapsed-p.delay)/450);
        ctx.globalAlpha=p.alpha*fade;
        ctx.strokeStyle=p.c; ctx.lineWidth=p.width;
        ctx.shadowColor=p.c; ctx.shadowBlur=4;
        ctx.lineCap='round'; ctx.beginPath();
        ctx.moveTo(p.x,p.y); ctx.lineTo(p.x2,p.y2); ctx.stroke();
      }
      ctx.shadowBlur=0; ctx.globalAlpha=1;
      if(elapsed>2400) name.classList.add('show');
    }
    requestAnimationFrame(draw);
  }
  document.getElementById('open').addEventListener('click',()=>{
    if(started) return;
    started=true; startTime=performance.now();
    makeParticles(); intro.classList.add('hide'); hint.style.opacity='.45';
  });
  window.addEventListener('resize',()=>{resize(); if(started) makeParticles();});
  resize(); requestAnimationFrame(draw);
})();
</script>
</body>
</html>
